<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaviya S — Social image</title>
    <link
      rel="stylesheet"
      href="/fonts/fonts.css"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 64px 72px 56px;
        display: flex;
        flex-direction: column;
        background: #f8f7f3;
        color: #191919;
        font-family: 'Schibsted Grotesk', sans-serif;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        background: #191919;
        color: #f8f7f3;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 24px;
      }
      h1 {
        margin: auto 0 32px;
        font-size: 184px;
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 1.05;
      }
      .footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-top: 28px;
        border-top: 2px solid #191919;
      }
      .role { margin: 0; font-size: 40px; white-space: nowrap; }
      .location { color: #66645f; }
      .site {
        margin: 0;
        font: 500 16px 'IBM Plex Mono', monospace;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">KS</div>
    <h1>KAVIYA S</h1>
    <div class="footer">
      <p class="role">Full Stack Developer <span class="location">/ Chennai, India</span></p>
      <p class="site">KAVIYA-S-PORTFOLIO.VERCEL.APP</p>
    </div>
  </body>
</html>
